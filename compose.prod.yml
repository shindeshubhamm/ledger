services:
  ledger:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - 8080:8080
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MILLIS=${JWT_EXPIRATION_MILLIS}