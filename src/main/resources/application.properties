spring.application.name=ledger

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/ledger
spring.datasource.username=ledgeruser
spring.datasource.password=ledgerpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging for troubleshooting
logging.level.org.springframework.boot.devtools=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.web=DEBUG

# JWT Configuration
jwt.secret=your-ultra-secret-key
jwt.expiration-millis=86400000