spring.application.name=ledger

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledgeruser
spring.datasource.password=ledgerpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging for troubleshooting
logging.level.org.springframework.boot.devtools=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.web=DEBUG

# JWT Configuration
jwt.secret=your-ultra-secret-key
jwt.expiration-millis=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs